<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2000px;
    height: 2000px;
    overflow: hidden;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  /* 1200x1200 캔버스 안에서 우하단 기준으로 정렬 */
  .box-br {
    position: absolute;
    right: 0; bottom: 0;
    width: 1200px; height: 1200px;
  }
  /* 삼각형은 우하단에 650x650 크기 100% 동일하게 고정 */
  .box-br img.svg-bg {
    position: absolute;
    right: 0; bottom: 0;
    width: 650px; height: 650px;
    object-fit: contain;
  }
  /* 텍스트 박스를 왼쪽 위로 크게 이동: right 90px, bottom 95px */
  .textbox-container {
    position: absolute;
    right: 80px;
    bottom: 85px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    z-index: 10;
  }
  /* 텍스트 박스 사이즈 2배 확대 */
  .text-card {
    padding: 28px 46px;
    border-radius: 30px;
    border: 7px solid #FFFFFF;
    box-shadow: 0 16px 36px rgba(0,0,0,0.65);
    text-align: right;
    line-height: 1.36;
  }
  /* 폰트 사이즈 2배: 26px -> 48px */
  .text-card span {
    display: block;
    font-size: 46px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -4px -4px 0 #000000,
       4px -4px 0 #000000,
      -4px  4px 0 #000000,
       4px  4px 0 #000000,
      -4px  0px 0 #000000,
       4px  0px 0 #000000,
       0px -4px 0 #000000,
       0px  4px 0 #000000,
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
       0 6px 14px rgba(0, 0, 0, 0.95);
    letter-spacing: -0.8px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
