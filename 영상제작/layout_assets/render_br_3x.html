<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1500px;
    height: 1500px;
    overflow: hidden;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  /* 삼각형 규격은 650x650 100% 불변 */
  .box-br {
    position: absolute;
    top: 0; left: 0;
    width: 650px; height: 650px;
  }
  .box-br img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  /* 텍스트 박스 위치: 왼쪽 위로 이동 (right: 75px, bottom: 75px) */
  .textbox-container {
    position: absolute;
    right: 75px;
    bottom: 75px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    z-index: 10;
  }
  /* 크기 3배 확대: 패딩 대형화, 두꺼운 흰 테두리, 깊은 입체 그림자 */
  .text-card {
    padding: 24px 38px;
    border-radius: 26px;
    border: 6px solid #FFFFFF;
    box-shadow: 0 12px 28px rgba(0,0,0,0.6);
    text-align: right;
    line-height: 1.35;
  }
  /* 폰트 3배 확대: 17.5px -> 36px */
  .text-card span {
    display: block;
    font-size: 34px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -3px -3px 0 #000000,
       3px -3px 0 #000000,
      -3px  3px 0 #000000,
       3px  3px 0 #000000,
      -3px  0px 0 #000000,
       3px  0px 0 #000000,
       0px -3px 0 #000000,
       0px  3px 0 #000000,
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
       0 5px 10px rgba(0, 0, 0, 0.95);
    letter-spacing: -0.6px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
