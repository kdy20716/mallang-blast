<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2000px;
    height: 2000px;
    overflow: hidden;
    background: transparent;
  }
  .box-tl {
    position: absolute;
    top: 0; left: 0;
    width: 1100px; height: 1100px;
  }
  .box-tl img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 750px; height: 750px;
    object-fit: contain;
  }
  .box-tl img.mascot {
    position: absolute;
    top: 25px; left: 30px;
    width: 580px; height: 580px;
    object-fit: contain;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,0.52));
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
