<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 30px;
    background: transparent;
    display: inline-block;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  .text-card {
    display: inline-block;
    padding: 22px 36px;
    border-radius: 26px;
    border: 6px solid #FFFFFF;
    box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    text-align: center;
    line-height: 1.4;
  }
  .text-card span {
    display: block;
    font-size: 32px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -3px -3px 0 #000000,
       3px -3px 0 #000000,
      -3px  3px 0 #000000,
       3px  3px 0 #000000,
      -3px  0px 0 #000000,
       3px  0px 0 #000000,
       0px -3px 0 #000000,
       0px  3px 0 #000000,
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
       0 5px 10px rgba(0, 0, 0, 0.95);
    letter-spacing: -0.6px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="target"></div>
</body>
</html>
