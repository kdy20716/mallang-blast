<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2500px;
    height: 2500px;
    overflow: hidden;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  .box-br {
    position: absolute;
    top: 0; left: 0;
    width: 900px; height: 900px;
  }
  .box-br img.svg-bg {
    position: absolute;
    bottom: 0; right: 0;
    width: 850px; height: 850px;
    object-fit: contain;
  }
  .textbox-container {
    position: absolute;
    right: 50px;
    bottom: 50px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    z-index: 10;
  }
  .text-card {
    padding: 26px 42px;
    border-radius: 30px;
    border: 7px solid #FFFFFF;
    text-align: right;
    line-height: 1.4;
  }
  .text-card span {
    display: block;
    font-size: 34px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -3px -3px 0 #000000,
       3px -3px 0 #000000,
      -3px  3px 0 #000000,
       3px  3px 0 #000000,
      -3px  0px 0 #000000,
       3px  0px 0 #000000,
       0px -3px 0 #000000,
       0px  3px 0 #000000,
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
       0 6px 12px rgba(0, 0, 0, 0.9);
    letter-spacing: -0.8px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
