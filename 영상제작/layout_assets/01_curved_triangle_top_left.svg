<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="900" viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA6D5"/>
      <stop offset="55%" stop-color="#FF6B9F"/>
      <stop offset="100%" stop-color="#9C51B6"/>
    </linearGradient>
    <filter id="shadowTL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="16" flood-color="#4A154B" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Curve bends deeply inward: Start at (0,0) -> (850, 0) -> curve to (0, 850) with control point close to corner (140, 140) -> Z -->
  <path d="M 0 0 L 850 0 Q 140 140 0 850 Z" fill="url(#pinkGrad)" filter="url(#shadowTL)" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M 20 20 L 760 20 Q 130 130 20 760 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-dasharray="12 10"/>
</svg>