<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1500px;
    height: 1500px;
    overflow: hidden;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  .box-br {
    position: absolute;
    top: 0; left: 0;
    width: 650px; height: 650px; /* 원래 크기 100% 복원 */
  }
  .box-br img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .textbox-container {
    position: absolute;
    right: 40px;
    bottom: 40px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    z-index: 10;
  }
  .text-card {
    padding: 12px 18px;
    border-radius: 16px;
    border: 3.5px solid #FFFFFF;
    box-shadow: 0 8px 20px rgba(0,0,0,0.55);
    text-align: right;
    line-height: 1.35;
  }
  .text-card span {
    display: block;
    font-size: 17.5px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
      -2px  0px 0 #000000,
       2px  0px 0 #000000,
       0px -2px 0 #000000,
       0px  2px 0 #000000,
       0 3px 6px rgba(0, 0, 0, 0.9);
    letter-spacing: -0.5px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
