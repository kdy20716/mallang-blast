<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA6D5"/>
      <stop offset="55%" stop-color="#FF6B9F"/>
      <stop offset="100%" stop-color="#9C51B6"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4CE4B1"/>
      <stop offset="50%" stop-color="#36C3D9"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <filter id="shadowTL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="14" flood-color="#4A154B" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowBR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="-8" stdDeviation="14" flood-color="#143A4D" flood-opacity="0.4"/>
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#180A2B" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#120524" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. TOP-LEFT INWARD-CURVED TRIANGLE -->
  <path d="M 0 0 L 560 0 Q 240 240 0 560 Z" fill="url(#pinkGrad)" filter="url(#shadowTL)" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M 16 16 L 490 16 Q 220 220 16 490 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 2. BOTTOM-RIGHT INWARD-CURVED TRIANGLE (SLIGHTLY SMALLER) -->
  <path d="M 1920 1080 L 1920 600 Q 1640 820 1420 1080 Z" fill="url(#mintGrad)" filter="url(#shadowBR)" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M 1904 1064 L 1904 660 Q 1660 840 1480 1064 Z" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 3. CENTER: 3 IN-GAME SCREEN DEVICE FRAMES (9:16 vertical ratio) -->
  <!-- Left Screen (화면 1) -->
  <g filter="url(#phoneShadow)" transform="translate(370, 190)">
    <rect width="350" height="650" rx="28" fill="rgba(15,8,30,0.85)" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="8" y="8" width="334" height="634" rx="20" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- Guide Text -->
    <text x="175" y="335" fill="#FFE082" font-size="22" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle" filter="url(#textGlow)">[ 인게임 화면 1 ]</text>
  </g>

  <!-- Center Screen (화면 2 - 메인 강조, 상단 살짝 돌출) -->
  <g filter="url(#phoneShadow)" transform="translate(785, 160)">
    <rect width="350" height="680" rx="30" fill="rgba(15,8,30,0.85)" stroke="#FFD700" stroke-width="6"/>
    <rect x="8" y="8" width="334" height="664" rx="22" fill="none" stroke="rgba(255,215,0,0.35)" stroke-width="2.5"/>
    <!-- Guide Text -->
    <text x="175" y="350" fill="#FFF070" font-size="24" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle" filter="url(#textGlow)">[ 인게임 화면 2 (메인) ]</text>
  </g>

  <!-- Right Screen (화면 3) -->
  <g filter="url(#phoneShadow)" transform="translate(1200, 190)">
    <rect width="350" height="650" rx="28" fill="rgba(15,8,30,0.85)" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="8" y="8" width="334" height="634" rx="20" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- Guide Text -->
    <text x="175" y="335" fill="#FFE082" font-size="22" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle" filter="url(#textGlow)">[ 인게임 화면 3 ]</text>
  </g>

  <!-- 4. BOTTOM-RIGHT TEXT AREA -->
  <g transform="translate(1520, 930)">
    <rect x="-15" y="-36" width="360" height="84" rx="16" fill="rgba(20,8,40,0.55)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <text x="165" y="-6" fill="#FFFFFF" font-size="24" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="900" text-anchor="middle" filter="url(#textGlow)">몰입감 넘치는 플레이!</text>
    <text x="165" y="28" fill="#FFF275" font-size="18" font-family="'Malgun Gothic', 'Noto Sans KR', sans-serif" font-weight="bold" text-anchor="middle" filter="url(#textGlow)">다양한 블록 &amp; 콤보 액션</text>
  </g>
</svg>