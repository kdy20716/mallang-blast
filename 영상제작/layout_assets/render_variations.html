<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2000px;
    height: 2000px;
    overflow: hidden;
    background: transparent;
  }
  .box-tl {
    position: absolute;
    top: 0; left: 0;
    width: 750px; height: 750px;
  }
  .box-tl img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .box-tl img.mascot {
    position: absolute;
    top: 55px; left: 65px;
    width: 360px; height: 360px; /* deutlich vergroessert */
    object-fit: contain;
    filter: drop-shadow(0 16px 28px rgba(0,0,0,0.5));
  }
  .box-br {
    position: absolute;
    top: 0; left: 0;
    width: 650px; height: 650px;
  }
  .box-br img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
