<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  /* 정확히 650x650 (이전과 1픽셀도 오차 없이 동일한 캔버스 크기) */
  .box-br {
    position: absolute;
    top: 0; left: 0;
    width: 650px; height: 650px;
  }
  .box-br img.svg-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  /* 오른쪽(우측 끝)에서 30px 떨어뜨려 우측 잘림 방지! 하단 38px 떨어뜨려 하단 잘림 방지! */
  .textbox-container {
    position: absolute;
    right: 28px;
    bottom: 35px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    z-index: 10;
  }
  /* 불투명 박스 + 선명한 흰색 테두리 */
  .text-card {
    padding: 15px 24px;
    border-radius: 20px;
    border: 4.5px solid #FFFFFF;
    box-shadow: 0 10px 24px rgba(0,0,0,0.6);
    text-align: right;
    line-height: 1.35;
  }
  /* 마음에 드셔했던 큼직하고 시원한 폰트 (2줄 기준 650 안에 완벽히 수용) */
  .text-card span {
    display: block;
    font-size: 24.5px;
    font-weight: 900;
    color: #FFFFFF;
    text-shadow: 
      -3px -3px 0 #000000,
       3px -3px 0 #000000,
      -3px  3px 0 #000000,
       3px  3px 0 #000000,
      -3px  0px 0 #000000,
       3px  0px 0 #000000,
       0px -3px 0 #000000,
       0px  3px 0 #000000,
      -2px -2px 0 #000000,
       2px -2px 0 #000000,
      -2px  2px 0 #000000,
       2px  2px 0 #000000,
       0 4px 8px rgba(0, 0, 0, 0.9);
    letter-spacing: -0.6px;
    word-break: keep-all;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="container"></div>
</body>
</html>
