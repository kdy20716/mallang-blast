<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1000px;
    height: 1000px;
    background: transparent;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    overflow: hidden;
  }

  /* 1. 핑크 네모 캐릭터 단독 워터마크 (정사각형 200x200) */
  #target-1 {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 200px;
    height: 200px;
    background: linear-gradient(135deg, #FFA6D5, #FF5B99);
    border: 4.5px solid #FFFFFF;
    border-radius: 40px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #target-1 .inner-white {
    width: 152px;
    height: 152px;
    background: #FFFFFF;
    border-radius: 28px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #target-1 img {
    width: 135px;
    height: 135px;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(220, 50, 110, 0.4));
  }

  /* 2. 네모 글래스모피즘 + 핑크 캐릭터 워터마크 (정사각형 200x200) */
  #target-2 {
    position: absolute;
    top: 50px;
    left: 320px;
    width: 200px;
    height: 200px;
    background: rgba(30, 22, 42, 0.85);
    border: 3.5px solid #FF6FA8;
    border-radius: 38px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 0 14px rgba(255, 111, 168, 0.4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #target-2 img {
    width: 125px;
    height: 125px;
    object-fit: contain;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
  }
  #target-2 span {
    font-size: 14px;
    font-weight: 900;
    color: #FFA6D5;
    letter-spacing: 1px;
    margin-top: 3px;
  }
</style>
